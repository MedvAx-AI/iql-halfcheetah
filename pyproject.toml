[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "iql-halfcheetah"
version = "0.1.0"
description = "Five-person IQL / HalfCheetah offline RL integration scaffold"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==2.2.6",
  "torch==2.7.1",
  "gymnasium[mujoco,other]==1.2.2",
  "mujoco==3.2.3",
  "minari[hdf5,gcs,hf]==0.5.3",
  "h5py==3.14.0",
  "typer==0.12.5",
  "click==8.1.8",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.13.2", "build==1.3.0", "nbformat==5.10.4"]
notebook = ["jupyterlab==4.4.9", "matplotlib==3.10.6", "pandas==2.3.2"]

[project.scripts]
iql-project = "iql_project.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
